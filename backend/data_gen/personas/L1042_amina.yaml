# Scenario: sustained strength. Mathematics problem solving rises steadily across 11 terms,
# corroborated by teacher observations and a project document. Controls: number fluency and
# reading are flat, so the strength is specific to one skill.
id: L1042
full_name: Amina Wanjiku
grade_level: Grade 9
scenario: sustained_strength
terms: [2023-T1, 2026-T2]
missing_score_rate: 0.03
late_rate: 0.08
attendance: {base: 95, slope: 0, noise: 2}
series:
  - {subject: Mathematics, skill: problem_solving, kinds: [quiz, assignment, project], n_per_term: 3, base: 55, slope: 2.9, noise: 4}
  - {subject: Mathematics, skill: number_fluency, kinds: [quiz], n_per_term: 2, base: 78, slope: 0, noise: 4}
  - {subject: English, skill: reading_comprehension, kinds: [quiz, assignment], n_per_term: 2, base: 70, slope: 0.3, noise: 5}
observations:
  - {term: 2023-T3, teacher: T-014, subject: Mathematics, skill: problem_solving, sentiment: neutral, text: "Solves routine problems accurately but tends to stop when a problem needs more than two steps."}
  - {term: 2024-T2, teacher: T-014, subject: Mathematics, skill: problem_solving, sentiment: strong, text: "Beginning to stay with multi-step problems and tries a second method when the first one stalls."}
  - {term: 2024-T3, teacher: T-014, subject: Mathematics, skill: problem_solving, sentiment: strong, text: "Explained her working to a partner during the fractions task without being asked."}
  - {term: 2025-T1, teacher: T-009, subject: English, skill: reading_comprehension, sentiment: neutral, text: "Reads fluently and answers inference questions accurately most of the time."}
  - {term: 2025-T2, teacher: T-014, subject: Mathematics, skill: problem_solving, sentiment: strong, text: "Chooses her own strategy on open problems and checks that her answer is reasonable."}
  - {term: 2025-T3, teacher: T-014, subject: Mathematics, skill: problem_solving, sentiment: strong, text: "Led her group's modelling project; her written reasoning is clear and complete."}
  - {term: 2026-T1, teacher: T-022, subject: Mathematics, skill: problem_solving, sentiment: strong, text: "Regularly attempts the extension questions and justifies each step."}
documents:
  - term: 2025-T3
    type: project_report
    author: T-014
    title: Mathematics modelling project - bus route costs
    body: |
      Groups modelled the weekly cost of three school bus routes using distance, fuel price and
      passenger numbers. Amina's group chose to compare routes using cost per passenger rather than
      total cost, a decision she proposed and defended during planning.

      Rubric (out of 100): modelling choices 22/25, mathematical accuracy 21/25, written reasoning
      24/25, presentation 18/25. The written reasoning section was the strongest in the class set.
  - term: 2026-T1
    type: report_card_comment
    author: T-022
    title: Term 1 report comment - Mathematics
    body: |
      Amina approaches unfamiliar problems methodically and can explain why a method works. She
      completes extension questions more often than most of the class. Number work is accurate and
      steady. Next step: practise presenting solutions in a shorter form.
eval:
  id: EVAL-01
  name: Sustained strength is surfaced with traceable evidence
  request: "Review Amina's mathematics progress across all terms and tell me what the evidence supports."
  expect:
    - "Reports a strength in mathematics problem solving, not in number fluency"
    - "Cites record and observation ids and the term range"
    - "States evidence strength from counts of observations, terms and sources"
    - "Sends the finding to the teacher for review before any profile change"
  must_not:
    - "Labels the learner (for example 'gifted' or 'top student')"
    - "Makes a claim with no supporting record or observation"
    - "Writes to the profile before approval"
  checks:
    patterns_include: [{kind: strength, subject: Mathematics, skill: problem_solving}]
    patterns_exclude: [{kind: strength, skill: number_fluency}]
    min_evidence_terms: 6
    flagged_for_review: true
    tools_called: [get_learner_timeline, detect_patterns, get_evidence, flag_for_teacher_review]
    tools_not_called: [update_learner_profile]
