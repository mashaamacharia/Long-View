[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "longview-backend"
version = "0.1.0"
description = "LongView: agentic longitudinal learner profiling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "mcp>=1.2",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-mcp-adapters>=0.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=0.3"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.ruff]
line-length = 100
